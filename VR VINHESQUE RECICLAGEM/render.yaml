services:
  - type: web
    name: vinhesque-mobile
    runtime: python
    buildCommand: "python -m pip install --upgrade pip && python -m pip install -r requirements-cloud.txt"
    startCommand: "python sync_server.py"
    envVars:
      - key: DB_PATH
        value: /data/vr_reciclagem.db
      - key: RECEIPTS_DIR
        value: /data/comprovantes
      - key: SYNC_TOKEN
        sync: false
    disks:
      - name: vinhesque-data
        mountPath: /data
        sizeGB: 1
